name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: iOS Simulator build
    # プロジェクトは Xcode 27 形式(objectVersion 110)なので、Xcode 27 が既定のランナーを使う
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Resolve packages
        run: xcodebuild -resolvePackageDependencies -project ChartTest.xcodeproj -scheme ChartTest

      - name: Build
        run: |
          set -o pipefail
          xcodebuild build \
            -project ChartTest.xcodeproj \
            -scheme ChartTest \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO
