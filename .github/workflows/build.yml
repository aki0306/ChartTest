name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: iOS Simulator build
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # このプロジェクトは Xcode 27 で作成されているため、ランナーにある一番新しい Xcode を使う
      - name: Select latest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | sort -V | tail -n 1)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Resolve packages
        run: xcodebuild -resolvePackageDependencies -project ChartTest.xcodeproj -scheme ChartTest

      - name: Build
        run: |
          set -o pipefail
          xcodebuild build \
            -project ChartTest.xcodeproj \
            -scheme ChartTest \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO
